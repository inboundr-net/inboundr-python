            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Sender'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /suppressions:
    get:
      tags:
        - Suppressions
      operationId: listSuppressions
      summary: List suppressions
      description: Addresses this account can no longer send to. Not on the Free plan.
      responses:
        '200':
          description: All suppressions.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Suppression'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags:
        - Suppressions
      operationId: createSuppression
      summary: Suppress an address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSuppressionRequest'
      responses:
        '201':
          description: Suppressed.
          content:
            application/json:
              schema:
                type: object
                required:
                  - address
                properties:
                  address:
                    type: string
                    format: email
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /suppressions/{address}:
    parameters:
      - $ref: '#/components/parameters/AddressPath'
    delete:
      tags:
        - Suppressions
      operationId: deleteSuppression
      summary: Unsuppress an address
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /forward-destinations:
    get:
      tags:
        - Forward destinations
      operationId: listForwardDestinations
      summary: List forward destinations
      description: Mailboxes asked to receive forwarded mail, and whether each has confirmed.
      responses:
        '200':
          description: All destinations.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ForwardDestination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags:
        - Forward destinations
      operationId: createForwardDestination
      summary: Request confirmation
      description: Asks the address to confirm. Asking again invalidates earlier links.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateForwardDestinationRequest'
      responses:
        '200':
          description: Already confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForwardDestinationRequest'
        '202':
          description: Confirmation requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForwardDestinationRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /forward-destinations/{address}:
    parameters:
      - $ref: '#/components/parameters/AddressPath'
    delete:
      tags:
        - Forward destinations
      operationId: deleteForwardDestination
      summary: Remove a forward destination
      description: Endpoints keep the address, but nothing is delivered to it until it confirms again.
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
webhooks:
  email.received:
    post:
      operationId: emailReceived
      summary: Email received
      description: |
        Sent to webhook endpoints for every routed email. Verify the
        `x-inboundr-signature` header against the raw body with the
        endpoint's `whsec_` secret before trusting it.
      parameters:
        - name: x-inboundr-signature
          in: header
          required: true
          schema:
            type: string
        - name: x-inboundr-event
          in: header
          required: true
          schema:
            type: string
            enum:
              - email.received
        - name: x-inboundr-delivery-id
          in: header
          required: true
          schema:
            type: string
        - name: x-inboundr-email-id
          in: header
          required: true
          schema:
            type: string
        - name: x-inboundr-id-signature
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailReceivedEvent'
      responses:
        2XX:
          description: Any 2xx marks the delivery successful. Anything else is retried.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: inb_…
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      description: '`nextCursor` from the previous page.'
      schema:
        type: string
    EmailId:
      name: id
      in: path
      required: true
      schema:
        type: string
        example: em_123
    DomainId:
      name: id
      in: path
      required: true
      schema:
        type: string
        example: dom_123
    EndpointId:
      name: id
      in: path
      required: true
      schema:
        type: string
        example: ep_123
    AddressPath:
      name: address
      in: path
      required: true
      description: The email address, URL-encoded (`user%40example.com`).
      schema:
        type: string
        format: email
  headers:
    RateLimitLimit:
      schema:
        type: integer
    RateLimitRemaining:
      schema:
        type: integer
    RateLimitReset:
      description: Seconds until the window resets.
      schema:
        type: integer
    RetryAfter:
      schema:
        type: integer
  responses:
    BadRequest:
      description: Validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing, malformed or revoked API key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PaymentRequired:
      description: Plan limit reached or feature not on the plan.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Read-only key attempting a write, or the action isn't available.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Doesn't exist or isn't yours.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Already exists, or the request is out of date.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Over the rate limit.
      headers:
        ratelimit-limit:
          $ref: '#/components/headers/RateLimitLimit'
        ratelimit-remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        ratelimit-reset:
          $ref: '#/components/headers/RateLimitReset'
        retry-after:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: A dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          description: A message, or a field tree for validation errors.
          oneOf:
            - type: string
            - $ref: '#/components/schemas/ValidationErrorTree'
    ValidationErrorTree:
      type: object
      properties:
        errors:
          type: array
          items:
            type: string
        properties:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ValidationErrorTree'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorTree'
    Timestamp:
      type: string
      format: date-time
    NullableTimestamp:
      type:
        - string
        - 'null'
      format: date-time
    EmailDirection:
      type: string
      enum:
        - inbound
        - outbound
    EmailDeliveryStatus:
      type: string
      enum:
        - delivered
        - pending
        - failed
    EmailSendStatus:
      type: string
      enum:
        - sent
        - delivered
        - delayed
        - rejected
        - bounced
        - complained
    EmailSummary:
      type: object
      required:
        - id
        - direction
        - threadId
        - messageId
        - fromAddress
        - toAddresses
        - ccAddresses
        - recipients
        - subject
        - spamVerdict
        - deliveryStatus
        - attachmentCount
