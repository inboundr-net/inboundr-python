            - messageId
            - from
            - to
            - cc
            - recipients
            - subject
            - text
            - html
            - attachments
            - verdicts
            - receivedAt
          properties:
            id:
              type: string
            threadId:
              type: string
            messageId:
              type:
                - string
                - 'null'
            from:
              type: string
            to:
              type: array
              items:
                type: string
            cc:
              type: array
              items:
                type: string
            recipients:
              type: array
              items:
                type: string
            subject:
              type:
                - string
                - 'null'
            text:
              type:
                - string
                - 'null'
            html:
              type:
                - string
                - 'null'
            attachments:
              type: array
              items:
                type: object
                required:
                  - filename
                  - contentType
                  - size
                  - downloadUrl
                properties:
                  filename:
                    type:
                      - string
                      - 'null'
                  contentType:
                    type:
                      - string
                      - 'null'
                  size:
                    type: integer
                  downloadUrl:
                    type:
                      - string
