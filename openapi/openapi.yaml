    SendEmailRequest:
      type: object
      properties:
        from:
          type: string
          format: email
        to:
          minItems: 1
          maxItems: 50
          type: array
          items:
            type: string
            format: email
        cc:
          maxItems: 50
          type: array
          items:
            type: string
            format: email
        replyTo:
          maxItems: 10
          type: array
          items:
            type: string
            format: email
        subject:
          type: string
          maxLength: 998
        text:
          type: string
        html:
          type: string
        inReplyTo:
          description: Message-ID of the email being answered; joins its thread.
          type: string
      required:
        - from
        - to
        - subject
      additionalProperties: false
      description: Provide at least one of `text` or `html`.
    ReplyRequest:
      type: object
      properties:
        text:
          type: string
        html:
          type: string
        replyAll:
          type: boolean
        from:
          description: Defaults to the address that received the email.
          type: string
          format: email
      additionalProperties: false
      description: Provide at least one of `text` or `html`.
    CreateDomainRequest:
      type: object
      properties:
        domain:
          type: string
          pattern: ^(?!-)[a-z0-9-]{1,63}(?<!-)(\.(?!-)[a-z0-9-]{1,63}(?<!-))+$
          example: acme.com
      required:
        - domain
      additionalProperties: false
    UpdateDomainRequest:
      type: object
      properties:
        catchAllEndpointIds:
          type: array
          items:
            type: string
          description: >-
            Endpoints that catch unrouted mail: at most one webhook and one email destination.
            Replaces the whole set; `[]` turns the catch-all off.
      required:
        - catchAllEndpointIds
      additionalProperties: false
    CreateAddressRequest:
      type: object
      properties:
        domainId:
          type: string
        localPart:
          description: The part before the @.
          example: support
          type: string
        endpointIds:
          type: array
          items:
            type: string
          description: >-
            Where the address delivers: at most one webhook, Slack or Discord endpoint, plus one
            email forward. `[]` makes it store-only.
      required:
        - domainId
        - localPart
      additionalProperties: false
    UpdateAddressRequest:
      type: object
      properties:
        endpointIds:
          type: array
          items:
            type: string
          description: >-
            Where the address delivers: at most one webhook, Slack or Discord endpoint, plus one
            email forward. `[]` makes it store-only.
        active:
          type: boolean
      additionalProperties: false
    CreateEndpointRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        type:
          default: webhook
          type: string
          enum:
            - webhook
            - forward
            - slack
            - discord
        url:
          description: Required for webhook, Slack and Discord.
          type: string
          format: uri
        forwardTo:
          description: Required for forward. One address, or several for a group.
          anyOf:
            - type: string
              format: email
            - minItems: 1
              type: array
              items:
                type: string
                format: email
        forwardAttachments:
          default: true
          type: boolean
        forwardFromName:
          description: Display name on the forwarded copy. Empty keeps the sender's.
          type:
            - string
            - 'null'
        forwardSubjectPrefix:
          description: Tag prepended to the forwarded copy's subject.
          type:
            - string
            - 'null'
        headers:
          type: object
          additionalProperties:
            type: string
          description: Sent with every delivery, e.g. Authorization. At most 10.
        timeoutSeconds:
          type: integer
          minimum: 1
          maximum: 30
          description: Per-request delivery timeout.
        maxAttempts:
          type: integer
          minimum: 1
          maximum: 10
          description: Total attempts, first plus retries, before a delivery is dead.
      required:
        - name
      additionalProperties: false
    UpdateEndpointRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        url:
          type: string
          format: uri
        headers:
          type: object
          additionalProperties:
            type: string
          description: Sent with every delivery, e.g. Authorization. At most 10.
        timeoutSeconds:
          type: integer
          minimum: 1
          maximum: 30
          description: Per-request delivery timeout.
        maxAttempts:
          type: integer
          minimum: 1
          maximum: 10
          description: Total attempts, first plus retries, before a delivery is dead.
        active:
          type: boolean
        forwardTo:
          anyOf:
            - type: string
              format: email
            - minItems: 1
              type: array
              items:
                type: string
                format: email
        forwardAttachments:
          type: boolean
        forwardFromName:
          description: Null or empty restores the original sender's name.
          type:
            - string
            - 'null'
        forwardSubjectPrefix:
          description: Null or empty leaves subjects untouched.
          type:
            - string
            - 'null'
      additionalProperties: false
    ShieldRuleInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        action:
          type: string
          enum:
            - allow
            - block
            - route
        conditions:
          minItems: 1
          maxItems: 8
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                enum:
                  - from
                  - from_domain
                  - to
                  - subject
                  - body
                  - has_attachment
                  - attachment_name
                  - attachment_type
                  - spam_verdict
                  - spf_verdict
                  - dkim_verdict
              operator:
                type: string
                enum:
                  - contains
                  - not_contains
                  - equals
                  - starts_with
                  - ends_with
                  - is_true
                  - is_false
              value:
                default: ''
                description: Compared case-insensitively. Ignored by `is_true` and `is_false`.
                type: string
                maxLength: 200
            required:
              - field
              - operator
            additionalProperties: false
        endpointIds:
          description: Required for `route`.
          type: array
          items:
            type: string
        domainId:
          description: Limit the rule to one domain.
          type:
            - string
            - 'null'
        addressId:
          description: Limit the rule to one address.
          type:
            - string
            - 'null'
        enabled:
          type: boolean
      required:
        - name
        - action
        - conditions
      additionalProperties: false
    ReplaceShieldRuleRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
